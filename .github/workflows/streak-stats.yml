name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Streak Stats Action
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          user: SalehAbdulla
          options: "theme=dark&hide_border=false"
