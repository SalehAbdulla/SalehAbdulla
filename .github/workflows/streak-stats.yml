name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Streak Stats Action
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          user: SalehAbdulla
          options: "theme=dark&hide_border=false"

      - name: Commit and push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-readme-streak-stats.svg
          git commit -m "Update streak stats SVG" || exit 0
          git push
